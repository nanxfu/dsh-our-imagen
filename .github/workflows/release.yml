name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build and publish release
    # 删除 tag 也会触发 push 事件；此时 tag 已不存在，跳过以免产生一次必然失败的运行。
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag 与 package.json version $version 不一致"
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Build offline bundle
        run: npm run package

      - name: Build npm tarball
        run: npm pack --pack-destination dist

      - name: Verify release artifacts
        shell: bash
        run: |
          ls -lh dist
          compgen -G "dist/*.zip" > /dev/null || { echo "::error::离线 zip 未生成，无法创建 Release"; exit 1; }
          compgen -G "dist/*.tgz" > /dev/null || { echo "::error::npm tarball 未生成，无法创建 Release"; exit 1; }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tgz
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Publish to npm (optional)
        # 未配置 NPM_TOKEN 时该 env 为 null；只写 `!= ''` 会把 null 判成「有值」而误触发发布。
        if: ${{ env.NODE_AUTH_TOKEN != null && env.NODE_AUTH_TOKEN != '' }}
        run: npm publish --provenance --access public
