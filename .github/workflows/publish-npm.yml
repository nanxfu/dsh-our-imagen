name: Publish npm

# 手动触发的 npm 发布（补发或 dry-run 演练）。
# 采用 npm Trusted Publishing (OIDC)，无需配置长期 NPM_TOKEN secret。
# 首次使用前需先在本地发布第一版占坑，再到 npmjs.com 包设置 → Trusted Publisher
# 绑定本仓库与工作流文件名（release.yml / publish-npm.yml）。

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "dry run（只校验打包，不真正发布）"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # npm Trusted Publishing (OIDC) 需要 Node >= 22.14.0 且 npm >= 11.5.1
          node-version: "24"
          cache: npm

      - name: Ensure npm >= 11.5.1 for OIDC
        run: npm install -g "npm@^11.5.1"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Check API contract
        run: npm run contract:check

      - name: Check model assets
        run: npm run models:check

      - name: Check client bundle is up to date
        run: node build.mjs --check

      - name: Run tests
        run: npm test

      - name: Publish
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            npm publish --dry-run --access public
          else
            npm publish --provenance --access public
          fi
